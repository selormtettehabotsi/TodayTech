# ─────────────────────────────────────────────────────────────
# TodayTech — Custom Sources
# Add your own sources here. No code changes needed.
# ─────────────────────────────────────────────────────────────

sources:
  # ── RSS Feeds ──────────────────────────────────────────────
  - name: "Opportunity Desk"
    type: rss
    value: "https://www.opportunitydesk.org/feed/"
    enabled: true
    tags: [scholarship, fellowship, global]

  - name: "Scholarship Positions"
    type: rss
    value: "https://www.scholarshippositions.com/feed/"
    enabled: true
    tags: [scholarship, global]

  # ── Search Queries ─────────────────────────────────────────
  # These are run through your configured search APIs.
  - name: "Tech Internships"
    type: search_query
    value: "tech internship 2027 open application"
    enabled: true
    tags: [internship]

  - name: "STEM Scholarships"
    type: search_query
    value: "STEM scholarship 2027 undergraduate application open"
    enabled: true
    tags: [scholarship]

  # ── Europe / France Scholarships & Fellowships ─────────────
  - name: "Eiffel Excellence Scholarship"
    type: search_query
    value: "Eiffel Excellence Scholarship Program 2027 application computer science STEM"
