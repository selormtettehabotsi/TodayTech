services:
  # 24/7 Telegram Bot & Background Scheduler
  todaytech-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todaytech-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./profile.yaml:/app/profile.yaml:ro
      - ./sources.yaml:/app/sources.yaml:ro
      - ./sources/packs:/app/sources/packs:ro
    environment:
      - TODAYTECH_DATA_DIR=/app/data
      - TODAYTECH_PROFILE=/app/profile.yaml
      - TODAYTECH_SOURCES=/app/sources.yaml
      - PYTHONUNBUFFERED=1
    command: ["run"]

  # Web Dashboard Interface (accessible via browser)
  todaytech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todaytech-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./profile.yaml:/app/profile.yaml:ro
      - ./sources.yaml:/app/sources.yaml:ro
      - ./sources/packs:/app/sources/packs:ro
    environment:
      - TODAYTECH_DATA_DIR=/app/data
      - TODAYTECH_PROFILE=/app/profile.yaml
      - TODAYTECH_SOURCES=/app/sources.yaml
      - PYTHONUNBUFFERED=1
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]
